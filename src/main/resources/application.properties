# Application Configuration
spring.application.name=${APP_NAME}
server.port=${SERVER_PORT:5002}

# Database Configuration
spring.datasource.url=jdbc:postgresql://${DB_HOST:postgres-discord}:${DB_PORT:5432}/${DB_NAME:discord_service}
spring.datasource.username=${DB_USER:discord_user}
spring.datasource.password=${DB_PASSWORD:discord_pass}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}

# RabbitMQ Configuration
spring.rabbitmq.host=${RABBITMQ_HOST}
spring.rabbitmq.port=${RABBITMQ_PORT}
spring.rabbitmq.username=${RABBITMQ_USERNAME}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}
spring.rabbitmq.virtual-host=${RABBITMQ_VIRTUAL_HOST}

